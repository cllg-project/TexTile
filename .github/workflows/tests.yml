name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dts-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dts-ui/package-lock.json
      - run: npm ci
      # `npm run lint` rewrites files (--fix); CI only checks
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/textile-ui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: dts-ui
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_DTS_BASE_URL=${{ vars.VITE_DTS_BASE_URL || 'https://comma.inria.fr/api' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

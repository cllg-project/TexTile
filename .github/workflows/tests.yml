name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dts-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dts-ui/package-lock.json
      - run: npm ci
      # `npm run lint` rewrites files (--fix); CI only checks
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npm run build
